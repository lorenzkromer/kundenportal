    toast(v.id ? 'Kunde gespeichert.' : 'Kunde angelegt.', { type: 'success' });
  },

  contact(v, form) {
    if (!v.name) { markInvalid(form, 'name', 'Bitte einen Namen angeben.'); return; }
    mutate(doc => {
      let contact = v.id ? byId(doc.contacts, v.id) : null;
      if (!contact) { contact = { id: uid(), clientId: v.clientId }; doc.contacts.push(contact); }
      Object.assign(contact, { name: v.name, role: v.role, email: v.email, phone: v.phone, isPrimary: !!v.isPrimary });
      if (contact.isPrimary) {
        doc.contacts.forEach(other => { if (other.clientId === contact.clientId && other.id !== contact.id) other.isPrimary = false; });
      }
    });
    bumpData(); closeModal(); toast('Kontaktperson gespeichert.', { type: 'success' });
  },

  quickadd(v, form) {
    if (!v.clientId) { markInvalid(form, 'clientId', 'Bitte einen Kunden wählen.'); return; }
    if (!v.summary) { markInvalid(form, 'summary', 'Bitte eine Kurzfassung angeben.'); return; }
    if (v.withFollowup && !v.followupTitle) { markInvalid(form, 'followupTitle', 'Bitte einen Titel für die Wiedervorlage angeben.'); return; }
    const before = snapshot();
    let ids = null;
    mutate(doc => {
      const interaction = {
        id: uid(), clientId: v.clientId, contactId: v.contactId || null, projectId: v.projectId || null,
        type: v.type || 'call', direction: v.direction || 'out',
        occurredAt: fromLocalInput(v.occurredAt), summary: v.summary, body: v.body || ''
      };
      doc.interactions.push(interaction);
      ids = { interaction: interaction.id, followup: null };
      if (v.withFollowup) {
        const f = {
          id: uid(), clientId: v.clientId, projectId: v.projectId || null,
          title: v.followupTitle, notes: '', dueDate: v.followupDue || addDaysKey(todayKey(), 7),
          status: 'open', sourceInteractionId: interaction.id, completedAt: null
        };
        doc.followups.push(f);
        ids.followup = f.id;
      }
    });
    bumpData(); closeModal();
    toast(ids.followup ? 'Interaktion + Wiedervorlage angelegt.' : 'Interaktion gespeichert.',
      { type: 'success', actionLabel: 'Rückgängig', action: () => { restoreSnapshot(before); toast('Rückgängig gemacht.'); } });
  },

  interaction(v, form) {
    if (!v.summary) { markInvalid(form, 'summary', 'Bitte eine Kurzfassung angeben.'); return; }
    mutate(doc => {
      const i = byId(doc.interactions, v.id);
      if (!i) return;
      Object.assign(i, {
        clientId: v.clientId, contactId: v.contactId || null, projectId: v.projectId || null,
        type: v.type, direction: v.direction, occurredAt: fromLocalInput(v.occurredAt),
        summary: v.summary, body: v.body || ''
      });
    });
    bumpData(); closeModal(); toast('Interaktion gespeichert.', { type: 'success' });
  },

  followup(v, form) {
    if (!v.title) { markInvalid(form, 'title', 'Bitte einen Titel angeben.'); return; }
    if (!v.dueDate) { markInvalid(form, 'dueDate', 'Bitte ein Fälligkeitsdatum wählen.'); return; }
    mutate(doc => {
      let f = v.id ? byId(doc.followups, v.id) : null;
      if (!f) { f = { id: uid(), status: 'open', completedAt: null, sourceInteractionId: null }; doc.followups.push(f); }
      Object.assign(f, { title: v.title, notes: v.notes || '', dueDate: v.dueDate, clientId: v.clientId || null, projectId: v.projectId || null });
    });
    bumpData(); closeModal(); toast('Wiedervorlage gespeichert.', { type: 'success' });
  },

  link(v, form) {
    if (!v.label) { markInvalid(form, 'label', 'Bitte eine Bezeichnung angeben.'); return; }
    if (!isSafeUrl(v.url)) {
      markInvalid(form, 'url', 'Diese URL ist nicht erlaubt. Zulässig sind z. B. https://, mailto:, tel:, file:// oder App-Schemes.');
      return;
    }
    mutate(doc => {
      let l = v.id ? byId(doc.links, v.id) : null;
      if (!l) { l = { id: uid(), ownerType: v.ownerType, ownerId: v.ownerId }; doc.links.push(l); }
      Object.assign(l, { label: v.label, url: v.url, kind: detectLinkKind(v.url) });
    });
    bumpData(); closeModal(); toast('Quick-Link gespeichert.', { type: 'success' });
  },

  project(v, form) {
    if (!v.name) { markInvalid(form, 'name', 'Bitte einen Namen angeben.'); return; }
    if (!v.clientId) { markInvalid(form, 'clientId', 'Bitte einen Kunden wählen.'); return; }
    mutate(doc => {
      let p = v.id ? byId(doc.projects, v.id) : null;
      if (!p) { p = { id: uid(), createdAt: nowIso() }; doc.projects.push(p); }
      Object.assign(p, {
        name: v.name, clientId: v.clientId, status: v.status || 'active',
        description: v.description || '', color: v.color || PROJECT_COLORS[0]
      });
    });
    bumpData(); closeModal(); toast('Projekt gespeichert.', { type: 'success' });
  },

  'task-add'(v, form) {
    if (!v.title) return;
    mutate(doc => {
      const siblings = doc.tasks.filter(t => t.projectId === v.projectId);
      const order = siblings.reduce((max, t) => Math.max(max, t.order || 0), 0) + 1;
      doc.tasks.push({ id: uid(), projectId: v.projectId, title: v.title, status: 'todo', estimateMinutes: null, order: order });
    });
    bumpData();
    form.reset();
    const input = form.querySelector('input[name=title]');
    if (input) setTimeout(() => input.focus(), 0);
  },

  'task-edit'(v, form) {
    if (!v.title) { markInvalid(form, 'title', 'Bitte einen Titel angeben.'); return; }
    let estimate = null;
    if (v.estimate) {
      estimate = parseDuration(v.estimate);
      if (estimate === null) { markInvalid(form, 'estimate', 'Dauer nicht erkannt. Beispiele: 1:30, 90m, 1,5h'); return; }
    }
    mutate(doc => {
      const t = byId(doc.tasks, v.id);
      if (!t) return;
      Object.assign(t, { title: v.title, status: v.status, estimateMinutes: estimate });
    });
    bumpData(); closeModal(); toast('Aufgabe gespeichert.', { type: 'success' });
  },

  'time-entry'(v, form) {
    if (!v.projectId) { markInvalid(form, 'projectId', 'Bitte ein Projekt wählen.'); return; }
    const minutes = parseDuration(v.duration);
    if (minutes === null || minutes <= 0) {
      markInvalid(form, 'duration', 'Dauer nicht erkannt. Beispiele: 1:30, 90m, 90, 1,5h');
      return;
    }
    mutate(doc => {
      let e = v.id ? byId(doc.timeEntries, v.id) : null;
      const start = keyToDate(v.day || todayKey());
      start.setHours(9, 0, 0, 0);
      if (!e) { e = { id: uid(), source: 'manual' }; doc.timeEntries.push(e); }
      Object.assign(e, {
        projectId: v.projectId, taskId: v.taskId || null,
        startedAt: e.source === 'timer' && e.startedAt && v.day === dateKey(new Date(e.startedAt)) ? e.startedAt : start.toISOString(),
        endedAt: null, durationMinutes: minutes, note: v.note || ''
      });
    });
    bumpData(); closeModal(); toast('Zeit gespeichert: ' + formatDuration(minutes), { type: 'success' });
  },

  'timer-start'(v, form) {
    if (!v.projectId) { markInvalid(form, 'projectId', 'Bitte ein Projekt wählen.'); return; }
    startTimer(v.projectId, null, v.note || '');
  },

  'settings-theme'(v) {
    mutate(doc => { doc.meta.settings.theme = v.theme; });
    applyTheme();
    toast('Theme gespeichert.', { type: 'success' });
  },

  'settings-signals'(v, form) {
    const stale = parseInt(v.staleDays, 10);
    const backup = parseInt(v.backupIntervalDays, 10);
    if (!isFinite(stale) || stale < 1) { markInvalid(form, 'staleDays', 'Bitte eine ganze Zahl größer 0.'); return; }
    if (!isFinite(backup) || backup < 1) { markInvalid(form, 'backupIntervalDays', 'Bitte eine ganze Zahl größer 0.'); return; }
    mutate(doc => {
      doc.meta.settings.staleDays = clampInt(stale, 1, 3650, 21);
      doc.meta.settings.backupIntervalDays = clampInt(backup, 1, 3650, 7);
    });
    bumpData();
    toast('Einstellungen gespeichert.', { type: 'success' });
  },

  'wipe-confirm'(v, form) {
    if (String(v.confirm || '').trim().toUpperCase() !== 'LÖSCHEN') {
      markInvalid(form, 'confirm', 'Bitte LÖSCHEN eintippen, um zu bestätigen.');
      return;
    }
    const before = snapshot();
    state.data = emptyDoc();
    state.data.meta.settings = before.meta.settings;
    bumpData(); persist(); closeModal(); render();
    toast('Alle Daten gelöscht.', {
      type: 'success', actionLabel: 'Rückgängig',
      action: () => { restoreSnapshot(before); bumpData(); toast('Wiederhergestellt.'); }
    });
  }
};

/* ============================================================================
   TIMER
   ========================================================================= */
function runningMinutes() {
  const t = D().meta.activeTimer;
  if (!t) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(t.startedAt).getTime()) / 60000));
}
function runningSeconds() {
  const t = D().meta.activeTimer;
  if (!t) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(t.startedAt).getTime()) / 1000));
}
function formatClock(seconds) {
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
  return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function startTimer(projectId, taskId, note) {
  const existing = D().meta.activeTimer;
  if (existing) {
    modalConfirm('Timer läuft bereits',
      'Für „' + (getProject(existing.projectId) ? getProject(existing.projectId).name : 'ein Projekt') +
      '“ läuft seit ' + formatDuration(runningMinutes()) + ' ein Timer. Soll er gestoppt und der neue gestartet werden?',
      'Stoppen & neu starten', () => { stopTimer(true); startTimer(projectId, taskId, note); });
    return;
  }
  mutate(doc => { doc.meta.activeTimer = { projectId: projectId, taskId: taskId || null, startedAt: nowIso(), note: note || '' }; });
  closeModal();
  toast('Timer gestartet.', { type: 'success' });
}
function stopTimer(silent) {
  const t = D().meta.activeTimer;
  if (!t) return;
  const minutes = runningMinutes();
  if (minutes > TIMER_MAX_HOURS * 60 && !silent) {
    modalConfirm('Sehr langer Timer',
      'Der Timer läuft seit ' + formatDuration(minutes) + '. Trotzdem als Zeiteintrag speichern? ' +
      'Du kannst die Dauer danach im Zeit-Screen korrigieren.',
      'Speichern', () => { closeModal(); commitTimer(t, minutes); });
    return;
  }
  commitTimer(t, minutes);
}
function commitTimer(t, minutes) {
  const saved = Math.max(1, minutes);
  mutate(doc => {
    doc.timeEntries.push({
      id: uid(), projectId: t.projectId, taskId: t.taskId || null,
      startedAt: t.startedAt, endedAt: nowIso(), durationMinutes: saved,
      note: t.note || '', source: 'timer'
    });
    doc.meta.activeTimer = null;
  });
  bumpData();
  toast('Timer gestoppt — ' + formatDuration(saved) + ' erfasst.', { type: 'success' });
}
function renderTimerSlot() {
  const slot = document.getElementById('timer-slot');
  const t = D() ? D().meta.activeTimer : null;
  if (!t) { if (slot.innerHTML) slot.innerHTML = ''; return; }
  const project = getProject(t.projectId);
  slot.innerHTML = `<span class="timer-chip" data-action="timer:goto" role="button" tabindex="0" title="Zum Projekt springen">
    <span aria-hidden="true">⏱</span>
    <span class="timer-chip__time" data-timer-clock>${esc(formatClock(runningSeconds()))}</span>
    <span class="timer-chip__name">${esc(project ? project.name : 'Projekt')}</span>
    <button class="btn btn--sm btn--icon btn--ghost" data-action="timer:stop" aria-label="Timer stoppen" style="min-height:20px;min-width:20px;padding:0">■</button>
  </span>`;
}
function tickTimer() {
  if (!state.data || !D().meta.activeTimer) return;
  const clock = document.querySelector('[data-timer-clock]');
  if (clock) clock.textContent = formatClock(runningSeconds());
  document.querySelectorAll('[data-timer-live]').forEach(el => { el.textContent = formatDuration(runningMinutes()); });
}

/* ============================================================================
   BACKUP / EXPORT / IMPORT
   ========================================================================= */
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function exportBackup() {
  try {
    const json = JSON.stringify(state.data, null, 2);
    downloadBlob(new Blob([json], { type: 'application/json' }), 'crm-backup-' + todayKey() + '.json');
    mutate(doc => { doc.meta.lastBackupAt = nowIso(); });
    state.ui.backupHintDismissed = false;
    toast('Backup exportiert.', { type: 'success' });
  } catch (err) {
    toast('Export fehlgeschlagen: ' + err.message, { type: 'error' });
  }
}

let pendingImport = null;

function openImportModal() {
  pendingImport = null;
  openModal({
    title: 'Backup importieren',
    body: `<div class="stack">
      <p class="small muted">Wähle eine zuvor exportierte <span class="mono">crm-backup-*.json</span>. Die Datei wird geprüft und bei Bedarf migriert — erst danach entscheidest du, wie sie angewendet wird.</p>
      <input class="input" type="file" accept="application/json,.json" data-import-file>
      <div data-import-result></div>
    </div>`,
    foot: `<button class="btn" type="button" data-action="modal:close">Abbrechen</button>`,
    focus: 'input[type=file]'
  });
}

function handleImportFile(file) {
  const result = document.querySelector('[data-import-result]');
  const reader = new FileReader();
  reader.onerror = () => { result.innerHTML = `<div class="banner banner--danger">Datei konnte nicht gelesen werden.</div>`; };
  reader.onload = () => {
    let raw;
    try { raw = JSON.parse(reader.result); }
    catch (err) {
      result.innerHTML = `<div class="banner banner--danger"><span>⚠️</span><div class="list__main">
        Die Datei enthält kein gültiges JSON. Die vorhandenen Daten bleiben unverändert.</div></div>`;
      return;
    }
    const problems = validateDoc(raw);
    if (problems.length) {
      result.innerHTML = `<div class="banner banner--danger"><span>⚠️</span><div class="list__main">
        <strong>Import nicht möglich:</strong><ul>${problems.map(p => `<li>• ${esc(p)}</li>`).join('')}</ul>
        Die vorhandenen Daten bleiben unverändert.</div></div>`;
      return;
    }
    let doc;
    try { doc = migrate(raw); }
    catch (err) {
      result.innerHTML = `<div class="banner banner--danger"><span>⚠️</span><div class="list__main">${esc(err.message)}</div></div>`;
      return;
    }
    pendingImport = doc;
    const labels = { clients: 'Kunden', contacts: 'Kontakte', links: 'Links', interactions: 'Interaktionen',
      followups: 'Wiedervorlagen', projects: 'Projekte', tasks: 'Aufgaben', timeEntries: 'Zeiteinträge' };
    result.innerHTML = `<div class="banner banner--info"><span>📦</span><div class="list__main">
        <strong>Backup vom ${esc(doc.meta.updatedAt ? formatDateTime(doc.meta.updatedAt) : 'unbekannt')}</strong>
        <div class="chip-row" style="margin-top:6px">${ENTITY_ARRAYS.map(k => `<span class="badge">${esc(labels[k])}: ${doc[k].length}</span>`).join('')}</div>
      </div></div>
      <div class="chip-row">
        <button class="btn btn--primary" type="button" data-action="import:apply" data-mode="replace">Ersetzen</button>
        <button class="btn" type="button" data-action="import:apply" data-mode="merge">Zusammenführen</button>
      </div>
      <p class="xsmall muted" style="margin-top:8px"><strong>Ersetzen</strong> verwirft die aktuellen Daten vollständig.
        <strong>Zusammenführen</strong> übernimmt Datensätze per <span class="mono">id</span> — der eingehende Stand gewinnt.
        Beides lässt sich in dieser Sitzung rückgängig machen.</p>`;
  };
  reader.readAsText(file);
}

function applyImport(mode) {
  if (!pendingImport) return;
  const before = snapshot();
  const incoming = pendingImport;
  if (mode === 'replace') {
    state.data = incoming;
  } else {
    const merged = snapshot();
    ENTITY_ARRAYS.forEach(key => {
      const index = new Map(merged[key].map(item => [item.id, item]));
      incoming[key].forEach(item => { index.set(item.id, item); });
      merged[key] = Array.from(index.values());
    });
    const keepTimer = merged.meta.activeTimer;
    merged.meta = Object.assign({}, merged.meta, incoming.meta, { activeTimer: keepTimer || incoming.meta.activeTimer || null });
    state.data = migrate(merged);
  }
  pendingImport = null;
  state.ui.undo = { snapshot: before, label: mode === 'replace' ? 'Import (Ersetzen)' : 'Import (Zusammenführen)' };
  bumpData(); persist(); applyTheme(); closeModal(); render();
  toast('Backup importiert (' + (mode === 'replace' ? 'ersetzt' : 'zusammengeführt') + ').', {
    type: 'success', actionLabel: 'Rückgängig', action: undoImport
  });
}

function undoImport() {
  if (!state.ui.undo) return;
  restoreSnapshot(state.ui.undo.snapshot);
  state.ui.undo = null;
  bumpData(); applyTheme(); render();
  toast('Import rückgängig gemacht.');
}

/* --- CSV-Export ---------------------------------------------------------- */
function csvCell(value) {
  const s = String(value === null || value === undefined ? '' : value);
  return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv() {
  const range = timeRangeKeys();
  const entries = entriesInRange();
  if (!entries.length) { toast('Keine Einträge im gewählten Zeitraum.', { type: 'error' }); return; }
  const header = ['Datum', 'Kunde', 'Projekt', 'Aufgabe', 'Dauer (h dez.)', 'Dauer (h:mm)', 'Notiz', 'Quelle'];
  const lines = [header.map(csvCell).join(';')];
  sortBy(entries, e => e.startedAt).forEach(e => {
    const p = getProject(e.projectId);
    const c = p ? getClient(p.clientId) : null;
    const t = e.taskId ? getTask(e.taskId) : null;
    lines.push([
      formatDate(e.startedAt),
      c ? c.name : '',
      p ? p.name : '',
      t ? t.title : '',
      formatNumber(hoursDecimal(e.durationMinutes), 2),
      formatDuration(e.durationMinutes).replace(' h', ''),
      e.note || '',
      e.source === 'timer' ? 'Timer' : 'manuell'
    ].map(csvCell).join(';'));
  });
  const from = range.from || dateKey(new Date(sortBy(entries, e => e.startedAt)[0].startedAt));
  const to = range.to || todayKey();
  /* BOM, damit Excel (de) UTF-8 korrekt erkennt */
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  downloadBlob(blob, 'zeiten-' + from + '_bis_' + to + '.csv');
  toast(entries.length + ' Einträge exportiert.', { type: 'success' });
}

/* ============================================================================
   TOAST
   ========================================================================= */
function toast(text, opts) {
  const o = opts || {};
  const root = document.getElementById('toast-root');
  const node = document.createElement('div');
  node.className = 'toast' + (o.type === 'success' ? ' toast--success' : (o.type === 'error' ? ' toast--error' : ''));
  const span = document.createElement('span');
  span.className = 'toast__text';
  span.textContent = text;
  node.appendChild(span);
  if (o.actionLabel && o.action) {
    const btn = document.createElement('button');
    btn.className = 'btn btn--sm';
    btn.textContent = o.actionLabel;
    btn.addEventListener('click', () => { node.remove(); o.action(); });
    node.appendChild(btn);
  }
  const close = document.createElement('button');
  close.className = 'btn btn--sm btn--ghost btn--icon';
  close.setAttribute('aria-label', 'Meldung schließen');
  close.textContent = '✕';
  close.addEventListener('click', () => node.remove());
  node.appendChild(close);
  root.appendChild(node);
  const live = document.getElementById(o.type === 'error' ? 'live-assertive' : 'live-polite');
  live.textContent = text;
  setTimeout(() => { if (node.parentNode) node.remove(); }, o.actionLabel ? 9000 : 4500);
}

/* ============================================================================
   ACTIONS (Event-Delegation)
   ========================================================================= */
const ACTIONS = {
  'modal:close': () => closeModal(),
  'confirm:run': el => {
    const fn = CONFIRMS[el.dataset.key];
    delete CONFIRMS[el.dataset.key];
    closeModal();
    if (fn) fn();
  },
  'theme:cycle': () => {
    const order = ['auto', 'light', 'dark'];
    const next = order[(order.indexOf(settings().theme) + 1) % order.length];
    mutate(doc => { doc.meta.settings.theme = next; });
    applyTheme();
    toast('Theme: ' + { auto: 'Automatisch', light: 'Hell', dark: 'Dunkel' }[next]);
  },
  'quickadd:open': el => {
    if (!D().clients.length) {
      modalConfirm('Noch kein Kunde', 'Interaktionen brauchen einen Kunden. Jetzt einen anlegen?', 'Kunde anlegen', () => modalClient(null));
      return;
    }
    modalQuickAdd({ clientId: el.dataset.client || '', projectId: el.dataset.project || '' });
  },
  'client:new': () => modalClient(null),
  'client:edit': el => modalClient(getClient(el.dataset.id)),
  'client:delete': el => {
    const c = getClient(el.dataset.id);
    if (!c) return;
    const counts = [interactionsOf(c.id).length + ' Interaktionen', projectsOf(c.id).length + ' Projekte',
      contactsOf(c.id).length + ' Kontakte', openFollowups(c.id).length + ' offene Wiedervorlagen'].join(', ');
    modalConfirm('Kunde löschen', '„' + c.name + '“ und alle abhängigen Daten (' + counts + ') werden gelöscht.',
      'Endgültig löschen', () => {
        const before = snapshot();
        mutate(doc => {
          const projectIds = doc.projects.filter(p => p.clientId === c.id).map(p => p.id);
          doc.clients = doc.clients.filter(x => x.id !== c.id);
          doc.contacts = doc.contacts.filter(x => x.clientId !== c.id);
          doc.interactions = doc.interactions.filter(x => x.clientId !== c.id);
          doc.followups = doc.followups.filter(x => x.clientId !== c.id);
          doc.projects = doc.projects.filter(x => x.clientId !== c.id);
          doc.tasks = doc.tasks.filter(x => !projectIds.includes(x.projectId));
          doc.timeEntries = doc.timeEntries.filter(x => !projectIds.includes(x.projectId));
          doc.links = doc.links.filter(x => !(x.ownerType === 'client' && x.ownerId === c.id) && !(x.ownerType === 'project' && projectIds.includes(x.ownerId)));
          if (doc.meta.activeTimer && projectIds.includes(doc.meta.activeTimer.projectId)) doc.meta.activeTimer = null;
        });
        bumpData();
        location.hash = '#/clients';
        toast('Kunde gelöscht.', { actionLabel: 'Rückgängig', action: () => { restoreSnapshot(before); bumpData(); } });
      }, true);
  },
  'contact:new': el => modalContact(null, el.dataset.client),
  'contact:edit': el => modalContact(getContact(el.dataset.id)),
  'contact:primary': el => {
    mutate(doc => {
      const c = byId(doc.contacts, el.dataset.id);
      if (!c) return;
      doc.contacts.forEach(o => { if (o.clientId === c.clientId) o.isPrimary = false; });
      c.isPrimary = true;
    });
    bumpData();
  },
  'contact:delete': el => {

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => false);
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return Promise.resolve(ok);
  } catch (e) { return Promise.resolve(false); }
}

/* ============================================================================
   THEME + EVENTS
   ========================================================================= */
const darkQuery = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;

function applyTheme() {
  const pref = state.data ? settings().theme : 'auto';
  const dark = pref === 'dark' || (pref === 'auto' && darkQuery && darkQuery.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  try { localStorage.setItem(THEME_MIRROR_KEY, pref); } catch (e) { /* egal */ }
  updateThemeButton();
}
function updateThemeButton() {
  const btn = document.getElementById('theme-btn');
  if (!btn || !state.data) return;
  const pref = settings().theme;
  btn.textContent = pref === 'auto' ? '◐' : (pref === 'dark' ? '🌙' : '☀');
  btn.title = 'Theme: ' + { auto: 'Automatisch', light: 'Hell', dark: 'Dunkel' }[pref] + ' (klicken zum Wechseln)';
}

let bindTimer = null;
function scheduleBindRender() {
  if (bindTimer) clearTimeout(bindTimer);
  bindTimer = setTimeout(() => { bindTimer = null; render(); }, 120);
}

function refreshDependents(form, changed) {
  const values = formValues(form);
  if (changed.name === 'clientId') {
    const contactSelect = form.querySelector('[data-contact-select]');
    if (contactSelect) contactSelect.innerHTML = contactOptionsFor(values.clientId, '');
    const projectSelect = form.querySelector('[data-project-select]');
    if (projectSelect) projectSelect.innerHTML = projectOptions(values.clientId || null, '', true);
  }
  if (changed.name === 'projectId') {
    const taskSelect = form.querySelector('[data-task-select]');
    if (taskSelect) taskSelect.innerHTML = taskOptionsFor(values.projectId, '');
  }
}

function bindEvents() {
  /* --- Klicks: eine Delegation fuer die ganze App --------------------- */
  document.addEventListener('click', ev => {
    const overlay = ev.target.closest('[data-overlay]');
    if (overlay && ev.target === overlay) { closeModal(); return; }

    const quick = ev.target.closest('[data-quick-due]');
    if (quick) {
      ev.preventDefault();
      const form = quick.closest('form');
      const targetName = quick.dataset.target || 'followupDue';
      const input = form && form.querySelector('[name="' + targetName + '"]');
      if (input) {
        input.value = addDaysKey(todayKey(), Number(quick.dataset.quickDue));
        form.querySelectorAll('[data-quick-due]').forEach(c => c.setAttribute('aria-pressed', c === quick ? 'true' : 'false'));
        const toggle = form.querySelector('[data-followup-toggle]');
        if (toggle && !toggle.checked) { toggle.checked = true; toggle.dispatchEvent(new Event('change', { bubbles: true })); }
      }
      return;
    }

    const el = ev.target.closest('[data-action]');
    if (!el) return;
    const fn = ACTIONS[el.dataset.action];
    if (!fn) return;
    ev.preventDefault();
    fn(el, ev);
  });

  /* Timer-Chip ist ein span mit role=button -> Tastatur nachruesten */
  document.addEventListener('keydown', ev => {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role=button][data-action]')) {
      ev.preventDefault();
      const fn = ACTIONS[ev.target.dataset.action];
      if (fn) fn(ev.target, ev);
    }
  });

  /* --- Formulare ------------------------------------------------------ */
  document.addEventListener('submit', ev => {
    const form = ev.target.closest('[data-form]');
    if (!form) return;
    ev.preventDefault();
    clearErrors(form);
    const handler = FORMS[form.dataset.form];
    if (handler) handler(formValues(form), form);
  });

  /* --- Eingaben: Filter, abhaengige Selects, Live-Vorschauen ---------- */
  const onFieldChange = ev => {
    const el = ev.target;
    if (el.dataset && el.dataset.bind) {
      state.ui[el.dataset.bind] = el.value;
      if (el.tagName === 'SELECT' || el.type === 'date') render(); else scheduleBindRender();
      return;
    }
    const form = el.closest && el.closest('form');
    if (!form) return;
    if (el.hasAttribute && el.hasAttribute('data-dependent')) refreshDependents(form, el);
    if (el.hasAttribute && el.hasAttribute('data-followup-toggle')) {
      const fields = form.querySelector('[data-followup-fields]');
      if (fields) {
        fields.hidden = !el.checked;
        if (el.checked) { const t = form.querySelector('[name=followupTitle]'); if (t) t.focus(); }
      }
    }
    if (el.name === 'duration') {
      const preview = form.querySelector('[data-duration-preview]');
      if (preview) {
        const minutes = parseDuration(el.value);
        preview.textContent = el.value
          ? (minutes === null ? 'Dauer nicht erkannt — z. B. 1:30, 90m, 1,5h' : '= ' + minutes + ' Minuten (' + formatDuration(minutes) + ')')
          : '';
      }
    }
  };
  document.addEventListener('input', onFieldChange);
  document.addEventListener('change', onFieldChange);
  document.addEventListener('change', ev => {
    const file = ev.target.closest('[data-import-file]');
    if (file && file.files && file.files[0]) handleImportFile(file.files[0]);
  });

  /* --- Tastatur ------------------------------------------------------- */
  let gPending = false;
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') {
      if (state.ui.modal) { ev.preventDefault(); closeModal(); }
      return;
    }
    if (ev.key === 'Tab' && state.ui.modal) { trapFocus(ev); return; }
    if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') {
      const form = (ev.target.closest && ev.target.closest('form')) || document.getElementById('modal-form');
      if (form) { ev.preventDefault(); form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true })); }
      return;
    }
    const target = ev.target;
    const typing = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT' || target.isContentEditable);
    if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (state.ui.modal) return;

    if (gPending) {
      gPending = false;
      const item = NAV_ITEMS.find(n => n.key === ev.key.toLowerCase());
      if (item) { ev.preventDefault(); location.hash = item.hash; }
      return;
    }
    switch (ev.key) {
      case 'g': gPending = true; setTimeout(() => { gPending = false; }, 1200); break;
      case 'n': ev.preventDefault(); ACTIONS['quickadd:open']({ dataset: {} }); break;
      case 't':
        ev.preventDefault();
        if (D().meta.activeTimer) stopTimer(false); else location.hash = '#/time';
        break;
      case '/': {
        const search = document.querySelector('input[type=search]');
        if (search) { ev.preventDefault(); search.focus(); search.select(); }
        break;
      }
      case '?': ev.preventDefault(); showShortcuts(); break;
    }
  });

  /* --- Routing & Lebenszyklus ---------------------------------------- */
  window.addEventListener('hashchange', applyRoute);
  window.addEventListener('pagehide', flushPersist);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushPersist(); });
  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', () => { if (settings().theme === 'auto') applyTheme(); });
  setInterval(tickTimer, 1000);
}

/* --- Multi-Tab-Schutz ---------------------------------------------------- */
function setupBroadcast() {
  if (!('BroadcastChannel' in window)) return;
  try { bc = new BroadcastChannel('freelancer-crm'); }
  catch (e) { bc = null; return; }
  bc.onmessage = ev => {
    if (!ev.data || ev.data.type !== 'saved' || ev.data.tab === TAB_ID) return;
    if (state.ui.modal) {
      /* Nicht wegrendern, solange ein Formular offen ist - sonst waeren Eingaben weg. */
      if (!state.ui.externalChangePending) {
        state.ui.externalChangePending = true;
        toast('In einem anderen Tab geändert — wird nach dem Schließen dieses Dialogs geladen.');
      }
      return;
    }
    reloadFromDb();
  };
}

function reloadFromDb() {
  dbGet().then(raw => {
    if (!raw) return;
    state.data = migrate(raw);
    bumpData(); applyTheme(); render();
    toast('In einem anderen Tab geändert — neu geladen.');
  }).catch(() => { /* still ignorieren, last-write-wins */ });
}

/* ============================================================================

   ========================================================================= */
async function boot() {
  try {
    dbHandle = await openDb();
  } catch (err) {
    dbHandle = null;
    setStorageWarning('Kein dauerhafter Speicher verfügbar (' + (err && err.message ? err.message : 'IndexedDB blockiert') +
      '). Die App funktioniert, aber Änderungen gehen beim Schließen verloren. Bitte über einen http-Server öffnen und den privaten Modus meiden.');
  }
  let raw = null;
  try { raw = await dbGet(); }
  catch (err) { setStorageWarning('Daten konnten nicht geladen werden: ' + err.message); }

  try {
    state.data = migrate(raw);
  } catch (err) {
    state.data = emptyDoc();
    setStorageWarning('Die gespeicherten Daten konnten nicht geladen werden: ' + err.message);
  }
  bumpData();
  applyTheme();
  setupBroadcast();
  bindEvents();
  state.ui.booted = true;
  applyRoute();
}

boot();
