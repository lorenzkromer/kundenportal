<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Freelancer-CRM</title>
<!-- Inline-Favicon: verhindert den automatischen /favicon.ico-Request. Keine externe Datei. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%87%3C/text%3E%3C/svg%3E">
<script>
  /* Theme vor dem ersten Paint setzen -> kein Umfaerben beim Laden.
     Der echte Wert kommt spaeter aus meta.settings.theme; hier reicht der Spiegel im localStorage. */
  (function () {
    try {
      var pref = localStorage.getItem('crm-theme') || 'auto';
      var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { /* localStorage kann blockiert sein - dann bleibt light */ }
  })();
</script>
<style>
/* ============================================================================
   DESIGN-TOKENS
   Light ist der Default, Dark wird ueber [data-theme="dark"] gesetzt.
   'auto' wird in JS zu light/dark aufgeloest -> nur zwei Bloecke noetig.
   ========================================================================= */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --surface-3: #e4e7ec;
  --border: #d8dce2;
  --border-strong: #b9c0c9;
  --text: #16191d;
  --muted: #646d78;
  --accent: #1f5fd6;
  --accent-soft: #e5edfc;
  --accent-fg: #ffffff;
  --danger: #c62828;
  --danger-soft: #fdecec;
  --success: #1b7a3d;
  --success-soft: #e6f4ea;
  --warn: #a15c00;
  --warn-soft: #fdf1dc;

  --r-lg: 12px;
  --r-md: 9px;
  --r-sm: 6px;
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;

  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 15px;
  --fs-lg: 18px;
  --fs-xl: 24px;

  --shadow: 0 1px 2px rgba(16, 22, 30, .06), 0 6px 16px rgba(16, 22, 30, .06);
  --shadow-lg: 0 8px 40px rgba(16, 22, 30, .22);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --topbar-h: 52px;
}

:root[data-theme="dark"] {
  --bg: #14171b;
  --surface: #1c2025;
  --surface-2: #23282e;
  --surface-3: #2c323a;
  --border: #333a42;
  --border-strong: #4a525c;
  --text: #e8eaed;
  --muted: #9aa4b0;
  --accent: #6f9dff;
  --accent-soft: #1e2a40;
  --accent-fg: #0d1117;
  --danger: #ef6a6a;
  --danger-soft: #35201f;
  --success: #6fcf8b;
  --success-soft: #1b2c21;
  --warn: #e0a458;
  --warn-soft: #2f2618;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 16px rgba(0, 0, 0, .3);
  --shadow-lg: 0 8px 40px rgba(0, 0, 0, .55);
}

/* ============================================================================
   RESET & BASIS
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
  overflow-wrap: anywhere;
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
h1 { font-size: var(--fs-xl); }
h2 { font-size: var(--fs-lg); }
h3 { font-size: var(--fs-md); }
p { margin: 0 0 var(--sp-2); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
ul { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ============================================================================
   TOPBAR + NAVIGATION
   ========================================================================= */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: var(--sp-2);
  height: var(--topbar-h);
  padding: 0 var(--sp-3);
  padding-top: env(safe-area-inset-top);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar__title {
  flex: 0 1 auto; min-width: 0;
  font-size: var(--fs-md); font-weight: 700; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar__spacer { flex: 1 1 0; min-width: 0; }
@media (max-width: 400px) {
  .topbar { gap: var(--sp-1); padding: 0 var(--sp-2); }
  .topbar__title { font-size: var(--fs-sm); }
}

.nav {
  position: sticky; top: var(--topbar-h); z-index: 30;
  display: flex; gap: var(--sp-1);
  padding: var(--sp-2) var(--sp-4);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav__item {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  color: var(--muted); font-size: var(--fs-sm); font-weight: 500;
  white-space: nowrap;
}
.nav__item:hover { background: var(--surface-2); text-decoration: none; }
.nav__item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav__icon { font-size: 15px; }

main {
  display: block;
  max-width: 1080px;
  margin: 0 auto;
  padding: var(--sp-5) var(--sp-4) var(--sp-6);
}

@media (max-width: 767px) {
  .nav {
    position: fixed; top: auto; bottom: 0; left: 0; right: 0;
    justify-content: space-between;
    gap: 0;
    padding: var(--sp-1) var(--sp-2);
    padding-bottom: calc(var(--sp-1) + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border); border-bottom: none;
    overflow: visible;
  }
  .nav__item {
    flex: 1 1 0; flex-direction: column; gap: 2px;
    min-width: 0; min-height: 46px;
    padding: 4px 2px;
    border-radius: var(--r-sm);
    font-size: 10px;
  }
  .nav__icon { font-size: 17px; }
  .nav__label { overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  main { padding: var(--sp-4) var(--sp-3) 96px; }
}

/* ============================================================================
   BUTTONS, EINGABEN, CHIPS
   ========================================================================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 34px;
  padding: 6px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--text);
  font: inherit; font-size: var(--fs-sm); font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn--primary:hover { filter: brightness(1.08); }
.btn--danger { color: var(--danger); border-color: var(--border); }
.btn--danger:hover { background: var(--danger-soft); }
.btn--ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn--ghost:hover { background: var(--surface-2); color: var(--text); }
.btn--sm { min-height: 28px; padding: 3px 9px; font-size: var(--fs-xs); }
.btn--icon { min-width: 34px; padding: 6px; }
.btn--block { width: 100%; }

.field { display: block; margin-bottom: var(--sp-3); }
.field__label { display: block; margin-bottom: 4px; font-size: var(--fs-sm); font-weight: 500; color: var(--muted); }
.input, .select, .textarea {
  display: block; width: 100%;
  min-height: 36px;
  padding: 7px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 16px; /* verhindert iOS-Zoom beim Fokus */
}
@media (min-width: 768px) { .input, .select, .textarea { font-size: var(--fs-md); } }
.textarea { min-height: 84px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--danger); }
.field__error { display: block; margin-top: 3px; font-size: var(--fs-xs); color: var(--danger); }
.field__hint { display: block; margin-top: 3px; font-size: var(--fs-xs); color: var(--muted); }
.field-row { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
.field-row > .field { flex: 1 1 160px; margin-bottom: var(--sp-3); }
.check { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--surface-2); color: var(--muted);
  font-size: var(--fs-xs); font-weight: 600; white-space: nowrap;
}
.badge--accent { background: var(--accent-soft); color: var(--accent); }
.badge--danger { background: var(--danger-soft); color: var(--danger); }
.badge--success { background: var(--success-soft); color: var(--success); }
.badge--warn { background: var(--warn-soft); color: var(--warn); }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 30px; padding: 4px 11px;
  border: 1px solid var(--border-strong); border-radius: 999px;
  background: var(--surface); color: var(--text);
  font: inherit; font-size: var(--fs-xs); font-weight: 500; cursor: pointer;
}
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

/* ============================================================================
   KARTEN, LISTEN, TIMELINE, TABELLEN
   ========================================================================= */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  margin-bottom: var(--sp-4);
  overflow: hidden;
}
.card__head {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border);
}
.card__head h2, .card__head h3 { font-size: var(--fs-md); }
.card__head--plain { border-bottom: none; padding-bottom: 0; }
.card__spacer { flex: 1; }
.card__body { padding: var(--sp-4); }
.card__body--flush { padding: 0; }

.grid-2 { display: grid; grid-template-columns: 1fr; gap: 0 var(--sp-4); }
.grid-2 > * { min-width: 0; } /* ohne das sprengen breite Tabellen das Raster */
@media (min-width: 900px) { .grid-2 { grid-template-columns: 1fr 1fr; align-items: start; } }

.list__item {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border);
}
.list__item:last-child { border-bottom: none; }
.list__item:hover { background: var(--surface-2); }
.list__main { flex: 1; min-width: 0; }
.list__title { font-weight: 600; font-size: var(--fs-md); }
.list__meta { color: var(--muted); font-size: var(--fs-sm); }
.list__actions { display: flex; gap: var(--sp-1); flex-shrink: 0; }
.row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.row--tight { gap: var(--sp-1); }
.stack > * + * { margin-top: var(--sp-2); }
.muted { color: var(--muted); }
.small { font-size: var(--fs-sm); }
.xsmall { font-size: var(--fs-xs); }
.strong { font-weight: 600; }
.right { margin-left: auto; }
.nowrap { white-space: nowrap; }
.mono { font-family: var(--mono); font-size: var(--fs-sm); }
.pre-wrap { white-space: pre-wrap; }
.done-text { text-decoration: line-through; color: var(--muted); }

.timeline__month {
  padding: var(--sp-2) var(--sp-4);
  background: var(--surface-2);
  font-size: var(--fs-xs); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.timeline__icon { font-size: 17px; line-height: 1.4; flex-shrink: 0; width: 22px; text-align: center; }

.empty { padding: var(--sp-5) var(--sp-4); text-align: center; color: var(--muted); }
.empty__icon { font-size: 30px; }
.empty__text { margin: var(--sp-2) 0 var(--sp-3); font-size: var(--fs-sm); }

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.data { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
table.data th, table.data td { padding: 8px var(--sp-3); text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data th { color: var(--muted); font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
table.data td.wrap { white-space: normal; min-width: 160px; }
table.data tr:last-child td { border-bottom: none; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }

.stat-row { display: flex; flex-wrap: wrap; gap: var(--sp-3); }
.stat { flex: 1 1 130px; padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); }
.stat__value { font-size: var(--fs-xl); font-weight: 700; font-variant-numeric: tabular-nums; }
.stat__label { font-size: var(--fs-xs); color: var(--muted); }

.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.banner {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  margin-bottom: var(--sp-4);
  border: 1px solid var(--border); border-left: 3px solid var(--warn);
  border-radius: var(--r-md);
  background: var(--warn-soft);
  font-size: var(--fs-sm);
}
.banner--info { border-left-color: var(--accent); background: var(--accent-soft); }
.banner--danger { border-left-color: var(--danger); background: var(--danger-soft); }
.page-head { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4); }
.page-head h1 { flex: 1 1 auto; min-width: 0; }
.section-title { margin: var(--sp-5) 0 var(--sp-2); font-size: var(--fs-sm); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.section-title:first-child { margin-top: 0; }

/* ============================================================================
   TIMER-CHIP
   ========================================================================= */
.timer-chip {
  display: inline-flex; align-items: center; gap: 6px;
  max-width: 46vw;
  padding: 4px 10px;
  border: 1px solid var(--success); border-radius: 999px;
  background: var(--success-soft); color: var(--success);
  font-size: var(--fs-xs); font-weight: 600;
  cursor: pointer;
}
.timer-chip__time { font-variant-numeric: tabular-nums; }
.timer-chip__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 520px) { .timer-chip__name { display: none; } }

/* ============================================================================
   MODAL
   ========================================================================= */
.overlay {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  padding: var(--sp-4);
  background: rgba(10, 13, 18, .5);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
.modal {
  display: flex; flex-direction: column;
  width: min(560px, 100%);
  max-height: min(88vh, 780px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
}
.modal--wide { width: min(760px, 100%); }
.modal__head {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border);
}
.modal__title { flex: 1; font-size: var(--fs-md); font-weight: 700; }
.modal__body { flex: 1; overflow-y: auto; padding: var(--sp-4); -webkit-overflow-scrolling: touch; }
.modal__foot {
  display: flex; gap: var(--sp-2); justify-content: flex-end;
  padding: var(--sp-3) var(--sp-4);
  border-top: 1px solid var(--border);
  background: var(--surface-2);
}
@media (max-width: 640px) {
  .overlay { align-items: flex-end; padding: 0; }
  .modal {
    width: 100%; max-height: 92vh;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    border-bottom: none;
  }
  .modal__foot { padding-bottom: calc(var(--sp-3) + env(safe-area-inset-bottom)); }
  .modal__foot .btn { flex: 1 1 0; }
}

/* ============================================================================
   TOASTS
   ========================================================================= */
.toasts {
  position: fixed; z-index: 80;
  left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom) + 70px);
  display: flex; flex-direction: column; gap: var(--sp-2);
  width: min(420px, calc(100vw - 24px));
}
@media (min-width: 768px) { .toasts { bottom: 20px; } }
.toast {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 10px var(--sp-3);
  border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--r-md);
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  font-size: var(--fs-sm);
}
.toast--success { border-left-color: var(--success); }
.toast--error { border-left-color: var(--danger); }
.toast__text { flex: 1; min-width: 0; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
</style>
</head>
<body>
<header class="topbar">
  <span class="topbar__title">📇 Freelancer-CRM</span>
  <span class="topbar__spacer"></span>
  <span id="timer-slot"></span>
  <button class="btn btn--primary btn--sm" data-action="quickadd:open" title="Neue Interaktion (n)">+ Interaktion</button>
  <button class="btn btn--ghost btn--icon btn--sm" data-action="theme:cycle" id="theme-btn" title="Theme wechseln" aria-label="Theme wechseln">☀</button>
</header>
<nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>
<main id="app" tabindex="-1"></main>
<div id="modal-root"></div>
<div class="toasts" id="toast-root"></div>
<div class="sr-only" id="live-polite" role="status" aria-live="polite"></div>
<div class="sr-only" id="live-assertive" role="alert" aria-live="assertive"></div>
<script>
'use strict';
/* ============================================================================
   KONSTANTEN / ENUMS
   ========================================================================= */
const SCHEMA_VERSION = 1;
const DB_NAME = 'freelancer-crm';
const DB_STORE = 'doc';
const DB_KEY = 'root';
const PERSIST_DEBOUNCE_MS = 400;
const THEME_MIRROR_KEY = 'crm-theme';
const LOCALE = 'de-AT';

const CLIENT_STATUS = {
  active:   { label: 'Aktiv',      badge: 'badge--success' },
  lead:     { label: 'Lead',       badge: 'badge--accent' },
  paused:   { label: 'Pausiert',   badge: 'badge--warn' },
  archived: { label: 'Archiviert', badge: '' }
};
const INTERACTION_TYPE = {
  call:    { label: 'Anruf',     icon: '📞' },
  email:   { label: 'E-Mail',    icon: '✉️' },
  meeting: { label: 'Meeting',   icon: '🤝' },
  note:    { label: 'Notiz',     icon: '📝' },
  message: { label: 'Nachricht', icon: '💬' }
};
const DIRECTION = {
  in:       { label: 'Eingehend', icon: '↙' },
  out:      { label: 'Ausgehend', icon: '↗' },
  internal: { label: 'Intern',    icon: '•' }
};
const FOLLOWUP_STATUS = { open: 'Offen', done: 'Erledigt' };
const PROJECT_STATUS = {
  active:   { label: 'Aktiv',      badge: 'badge--success' },
  onhold:   { label: 'Pausiert',   badge: 'badge--warn' },
  done:     { label: 'Fertig',     badge: 'badge--accent' },
  archived: { label: 'Archiviert', badge: '' }
};
const TASK_STATUS = {
  todo:  { label: 'Offen',      icon: '○' },
  doing: { label: 'In Arbeit',  icon: '◐' },
  done:  { label: 'Erledigt',   icon: '●' }
};
const TASK_CYCLE = { todo: 'doing', doing: 'done', done: 'todo' };
const LINK_KIND = {
  note:   { label: 'Notiz',   icon: '🗒' },
  repo:   { label: 'Repo',    icon: '🐙' },
  ticket: { label: 'Ticket',  icon: '🎫' },
  docs:   { label: 'Doku',    icon: '📚' },
  design: { label: 'Design',  icon: '🎨' },
  folder: { label: 'Ordner',  icon: '📁' },
  mail:   { label: 'Mail',    icon: '✉️' },
  web:    { label: 'Web',     icon: '🔗' }
};
const PROJECT_COLORS = ['#1f5fd6', '#0f8a6a', '#b4531f', '#7b3fbf', '#c0392b', '#0f7b9c', '#8a6d1f', '#4a5568'];

/* ============================================================================
   DB-LAYER (IndexedDB)
   Ein Object-Store, ein Key, das gesamte Dokument als ein JSON-Blob.
   Die Datenmenge ist winzig -> in-memory halten, "Queries" sind filter/sort.
   ========================================================================= */
function openDb() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('IndexedDB ist in diesem Browser nicht verfügbar.')); return; }
    let req;
    try { req = indexedDB.open(DB_NAME, 1); }
    catch (err) { reject(err); return; }
    req.onupgradeneeded = () => { req.result.createObjectStore(DB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB konnte nicht geöffnet werden.'));
    req.onblocked = () => reject(new Error('IndexedDB ist durch einen anderen Tab blockiert.'));
  });
}

function dbGet() {
  return new Promise((resolve, reject) => {
    if (!dbHandle) { resolve(null); return; }
    const tx = dbHandle.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(DB_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(doc) {
  return new Promise((resolve, reject) => {
    if (!dbHandle) { resolve(false); return; }
    const tx = dbHandle.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(doc, DB_KEY);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('Schreibvorgang abgebrochen.'));
  });
}

/* ============================================================================
   DATENMODELL & MIGRATIONEN
   ========================================================================= */
const ENTITY_ARRAYS = ['clients', 'contacts', 'links', 'interactions', 'followups', 'projects', 'tasks', 'timeEntries'];

function emptyDoc() {
  const now = new Date().toISOString();
  return {
    clients: [], contacts: [], links: [], interactions: [],
    followups: [], projects: [], tasks: [], timeEntries: [],
    meta: {
      schemaVersion: SCHEMA_VERSION,
      createdAt: now,
      updatedAt: now,
      lastBackupAt: null,
      activeTimer: null,
      settings: { theme: 'auto', staleDays: 21, backupIntervalDays: 7 }
    }
  };
}

function docVersion(doc) {
  if (!doc) return 0;
  if (doc.meta && typeof doc.meta.schemaVersion === 'number') return doc.meta.schemaVersion;
  if (typeof doc.schemaVersion === 'number') return doc.schemaVersion;
  return 1;
}

/* Schrittweise Migrationen v(n) -> v(n+1). Neue Entitaets-Arrays kommen hier
   mit leerem Default dazu; bestehende Daten brechen dadurch nie. */
const MIGRATIONS = {
  /* Beispiel fuer die naechste Version:
     2: function (doc) { doc.invoices = doc.invoices || []; return doc; } */
};

function migrate(raw) {
  const doc = raw ? JSON.parse(JSON.stringify(raw)) : emptyDoc();
  let version = docVersion(doc);
  if (version > SCHEMA_VERSION) {
    throw new Error('Diese Datei stammt aus einer neueren Version (Schema ' + version +
      '). Bitte zuerst die App aktualisieren — die Daten werden nicht verändert.');
  }
  while (version < SCHEMA_VERSION) {
    const step = MIGRATIONS[version + 1];
    if (step) step(doc);
    version += 1;
  }
  /* Struktur-Defaults auffuellen: fehlende Arrays und meta-Felder ergaenzen. */
  const base = emptyDoc();
  ENTITY_ARRAYS.forEach(key => { if (!Array.isArray(doc[key])) doc[key] = []; });
  doc.meta = Object.assign({}, base.meta, doc.meta || {});
  doc.meta.settings = Object.assign({}, base.meta.settings, doc.meta.settings || {});
  doc.meta.schemaVersion = SCHEMA_VERSION;
  delete doc.schemaVersion;
  const s = doc.meta.settings;
  if (!['auto', 'light', 'dark'].includes(s.theme)) s.theme = 'auto';
  s.staleDays = clampInt(s.staleDays, 1, 3650, 21);
  s.backupIntervalDays = clampInt(s.backupIntervalDays, 1, 3650, 7);
  return doc;
}

/* Grundpruefung auf Struktur. Gibt eine Liste von Problemen zurueck (leer = ok). */
function validateDoc(doc) {
  const problems = [];
  if (!doc || typeof doc !== 'object' || Array.isArray(doc)) { return ['Die Datei enthält kein CRM-Dokument.']; }
  const present = ENTITY_ARRAYS.filter(key => key in doc);
  if (!present.length && !doc.meta) problems.push('Die Datei sieht nicht nach einem CRM-Backup aus.');
  ENTITY_ARRAYS.forEach(key => {
    if (key in doc && !Array.isArray(doc[key])) problems.push('Feld "' + key + '" ist kein Array.');
  });
  if ('meta' in doc && (typeof doc.meta !== 'object' || doc.meta === null)) problems.push('Feld "meta" ist ungültig.');
  const version = docVersion(doc);
  if (version > SCHEMA_VERSION) {
    problems.push('Schema-Version ' + version + ' ist neuer als diese App (' + SCHEMA_VERSION + ').');
  }
  return problems;
}

/* ============================================================================
   PERSIST + RENDER-LOOP
   ========================================================================= */
let persistTimer = null;
let persistPending = false;

function persist() {
  persistPending = true;
  if (persistTimer) clearTimeout(persistTimer);
  persistTimer = setTimeout(flushPersist, PERSIST_DEBOUNCE_MS);
}

function flushPersist() {
  if (!persistPending) return;
  if (persistTimer) { clearTimeout(persistTimer); persistTimer = null; }
  persistPending = false;
  if (!dbHandle) return;
  dbPut(state.data).then(() => {
    if (bc) { try { bc.postMessage({ type: 'saved', tab: TAB_ID }); } catch (e) { /* egal */ } }
  }).catch(err => {
    const quota = err && (err.name === 'QuotaExceededError' || /quota/i.test(err.message || ''));
    setStorageWarning(quota
      ? 'Speicher voll — die letzten Änderungen konnten nicht gesichert werden. Bitte exportiere ein Backup und lösche alte Daten.'
      : 'Änderungen konnten nicht gespeichert werden: ' + (err && err.message ? err.message : 'unbekannter Fehler'));
    render();
  });
}

function setStorageWarning(text) { state.ui.storageWarning = text; }

/* Der einzige Weg, Daten zu aendern: mutieren -> speichern -> neu rendern. */
function mutate(fn) {
  const result = fn(state.data);
  state.data.meta.updatedAt = new Date().toISOString();
  persist();
  render();
  return result;
}

let renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    try { paint(); }
    catch (err) {
      console.error('Render-Fehler', err);
      document.getElementById('app').innerHTML =
        '<div class="banner banner--danger">Beim Zeichnen der Ansicht ist ein Fehler aufgetreten: ' +
        esc(err && err.message ? err.message : String(err)) + '</div>';
    }
  });
}

/* Zeichnet Navigation, Timer-Chip und die aktuelle View.
   Fokus und Caret eines aktiven data-bind-Feldes werden wiederhergestellt,
   damit das Tippen in Suchfeldern durch Re-Renders nicht unterbrochen wird. */
function paint() {
  const active = document.activeElement;
  const bind = active && active.dataset ? active.dataset.bind : null;
  const caret = bind && typeof active.selectionStart === 'number' ? active.selectionStart : null;

  renderNav();
  renderTimerSlot();
  const app = document.getElementById('app');
  app.innerHTML = viewHtml();

  if (bind) {
    const next = app.querySelector('[data-bind="' + bind + '"]') || document.querySelector('[data-bind="' + bind + '"]');
    if (next && next !== document.activeElement) {
      next.focus({ preventScroll: true });
      if (caret !== null && typeof next.setSelectionRange === 'function') {
        try { next.setSelectionRange(caret, caret); } catch (e) { /* z.B. bei type=date */ }
      }
    }
  }
  renderModal();
  updateThemeButton();
}

function renderNav() {
  const nav = document.getElementById('nav');
  const html = NAV_ITEMS.map(item => {
    const current = item.route === state.route.name ? ' aria-current="page"' : '';
    return '<a class="nav__item" href="' + item.hash + '"' + current + '>' +
      '<span class="nav__icon" aria-hidden="true">' + item.icon + '</span>' +
      '<span class="nav__label">' + item.label + '</span></a>';
  }).join('');
  if (nav.dataset.route !== state.route.name) { nav.innerHTML = html; nav.dataset.route = state.route.name; }
}

/* ============================================================================
   UTILITIES
   ========================================================================= */
function uid() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}
function esc(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function attr(value) { return esc(value); }
function truncate(text, max) {
  const s = String(text || '');
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}
function initials(name) {
  return String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] ? w[0].toUpperCase() : '').join('');
}
function clampInt(value, min, max, fallback) {
  const n = parseInt(value, 10);
  if (!isFinite(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}
function byId(list, id) { return list.find(item => item.id === id) || null; }
function sortBy(list, pick, desc) {
  return list.slice().sort((a, b) => {
    const x = pick(a), y = pick(b);
    if (x === y) return 0;
    return (x > y ? 1 : -1) * (desc ? -1 : 1);
  });
}
function nowIso() { return new Date().toISOString(); }

/* --- Datum: intern immer YYYY-MM-DD (lokal), nie UTC-verschoben --------- */
function todayKey() { return dateKey(new Date()); }
function dateKey(d) {
  const date = (d instanceof Date) ? d : new Date(d);
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return date.getFullYear() + '-' + m + '-' + day;
}
function keyToDate(key) {
  const parts = String(key || '').slice(0, 10).split('-');
  return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2] || 1));
}
function addDaysKey(key, days) {
  const d = keyToDate(key);
  d.setDate(d.getDate() + days);
  return dateKey(d);
}
function daysBetween(fromKey, toKey) {
  const a = keyToDate(fromKey), b = keyToDate(toKey);
  return Math.round((b - a) / 86400000);
}
function daysSince(iso) {
  if (!iso) return null;
  return daysBetween(dateKey(new Date(iso)), todayKey());
}
function weekStartKey(d) {
  const date = (d instanceof Date) ? new Date(d) : keyToDate(d);
  const day = (date.getDay() + 6) % 7; /* Montag = 0 */
  date.setDate(date.getDate() - day);
  return dateKey(date);
}
function isOverdue(dueKey) { return dueKey < todayKey(); }
function isToday(dueKey) { return dueKey === todayKey(); }
function isThisWeek(dueKey) {
  const start = weekStartKey(new Date());
  return dueKey >= start && dueKey <= addDaysKey(start, 6);
}

const fmtDate = new Intl.DateTimeFormat(LOCALE, { day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtDateLong = new Intl.DateTimeFormat(LOCALE, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
const fmtMonth = new Intl.DateTimeFormat(LOCALE, { month: 'long', year: 'numeric' });
const fmtTime = new Intl.DateTimeFormat(LOCALE, { hour: '2-digit', minute: '2-digit' });
const fmtNum1 = new Intl.NumberFormat(LOCALE, { minimumFractionDigits: 1, maximumFractionDigits: 2 });
const fmtNum2 = new Intl.NumberFormat(LOCALE, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function formatDate(value) { if (!value) return '—'; return fmtDate.format(value.length === 10 ? keyToDate(value) : new Date(value)); }
function formatDateLong(value) { if (!value) return '—'; return fmtDateLong.format(value.length === 10 ? keyToDate(value) : new Date(value)); }
function formatMonth(value) { return fmtMonth.format(new Date(value)); }
function formatDateTime(iso) { if (!iso) return '—'; const d = new Date(iso); return fmtDate.format(d) + ', ' + fmtTime.format(d); }
function formatNumber(n, digits) { return (digits === 2 ? fmtNum2 : fmtNum1).format(n || 0); }

/* "heute" / "gestern" / "vor 3 Tagen" / "in 5 Tagen" */
function relativeDays(dayKey) {
  const diff = daysBetween(todayKey(), dayKey);
  if (diff === 0) return 'heute';
  if (diff === 1) return 'morgen';
  if (diff === -1) return 'gestern';
  if (diff < 0) return 'vor ' + Math.abs(diff) + ' Tagen';
  return 'in ' + diff + ' Tagen';
}

/* Dauer-Parser fuer die Zeiterfassung. Erlaubte Schreibweisen:
     "1:30"  -> 90     "0:45" -> 45
     "90m"   -> 90     "90"   -> 90     "45 min" -> 45
     "1,5h"  -> 90     "1.5h" -> 90     "2 h"    -> 120
   Rueckgabe: Minuten (Number) oder null, wenn nicht interpretierbar. */
function parseDuration(input) {
  const raw = String(input || '').trim().toLowerCase().replace(/\s+/g, '');
  if (!raw) return null;
  let m = raw.match(/^(\d{1,3}):([0-5]?\d)$/);
  if (m) return Number(m[1]) * 60 + Number(m[2]);
  m = raw.match(/^(\d+(?:[.,]\d+)?)(h|std|stunden?)$/);
  if (m) return Math.round(Number(m[1].replace(',', '.')) * 60);
  m = raw.match(/^(\d+(?:[.,]\d+)?)(m|min|minuten?)$/);
  if (m) return Math.round(Number(m[1].replace(',', '.')));
  m = raw.match(/^(\d+(?:[.,]\d+)?)$/);
  if (m) {
    const n = Number(m[1].replace(',', '.'));
    return Number.isInteger(n) ? Math.round(n) : Math.round(n * 60); /* "90" = 90 min, "1,5" = 1,5 h */
  }
  return null;
}
function formatDuration(minutes) {
  const total = Math.max(0, Math.round(minutes || 0));
  const h = Math.floor(total / 60), m = total % 60;
  return h + ':' + String(m).padStart(2, '0') + ' h';
}
function formatHours(minutes) { return formatNumber((minutes || 0) / 60, 2) + ' h'; }
function hoursDecimal(minutes) { return Math.round((minutes || 0) / 0.6) / 100; }

/* ============================================================================
   SELEKTOREN / QUERIES
   Reine Funktionen ueber state.data. Views lesen nur, sie schreiben nie.
   Teure Ergebnisse werden pro Datenstand gecacht (memo).
   ========================================================================= */
let dataVersion = 0;
const memoCache = new Map();
let memoVersion = -1;
function memo(key, fn) {
  if (memoVersion !== dataVersion) { memoCache.clear(); memoVersion = dataVersion; }
  if (memoCache.has(key)) return memoCache.get(key);
  const value = fn();
  memoCache.set(key, value);
  return value;
}
function bumpData() { dataVersion += 1; }

const D = () => state.data;
function settings() { return state.data.meta.settings; }
function getClient(id) { return byId(D().clients, id); }
function getProject(id) { return byId(D().projects, id); }
function getContact(id) { return byId(D().contacts, id); }
function getTask(id) { return byId(D().tasks, id); }

function contactsOf(clientId) { return D().contacts.filter(c => c.clientId === clientId); }
function linksOf(ownerType, ownerId) { return D().links.filter(l => l.ownerType === ownerType && l.ownerId === ownerId); }
function projectsOf(clientId) { return D().projects.filter(p => p.clientId === clientId); }
function tasksOf(projectId) { return sortBy(D().tasks.filter(t => t.projectId === projectId), t => t.order || 0); }
function interactionsOf(clientId) { return sortBy(D().interactions.filter(i => i.clientId === clientId), i => i.occurredAt, true); }
function interactionsOfProject(projectId) { return sortBy(D().interactions.filter(i => i.projectId === projectId), i => i.occurredAt, true); }
function timeEntriesOfProject(projectId) { return D().timeEntries.filter(e => e.projectId === projectId); }

function lastContactAt(clientId) {
  return memo('lastContact:' + clientId, () => {
    let latest = null;
    D().interactions.forEach(i => { if (i.clientId === clientId && (!latest || i.occurredAt > latest)) latest = i.occurredAt; });
    return latest;
  });
}

function staleClients() {
  const limit = settings().staleDays;
  return memo('stale:' + limit, () => D().clients
    .filter(c => c.status === 'active')
    .map(c => ({ client: c, last: lastContactAt(c.id) }))
    .filter(x => x.last === null || daysSince(x.last) >= limit)
    .sort((a, b) => {
      if (a.last === null && b.last === null) return a.client.name.localeCompare(b.client.name, LOCALE);
      if (a.last === null) return -1;
      if (b.last === null) return 1;
      return a.last < b.last ? -1 : 1;
    }));
}

function openFollowups(clientId) {
  const list = D().followups.filter(f => f.status === 'open' && (clientId === undefined || f.clientId === clientId));
  return sortBy(list, f => f.dueDate || '9999-12-31');
}
function openFollowupsOfProject(projectId) {
  return sortBy(D().followups.filter(f => f.status === 'open' && f.projectId === projectId), f => f.dueDate || '9999-12-31');
}
function dueFollowups() { const t = todayKey(); return openFollowups().filter(f => f.dueDate && f.dueDate <= t); }
function overdueFollowups() { const t = todayKey(); return openFollowups().filter(f => f.dueDate && f.dueDate < t); }

/* Der naechste Schritt pro Kunde: faellige Wiedervorlage schlaegt Stille. */
function nextActionFor(clientId) {
  const open = openFollowups(clientId);
  if (open.length) {
    const f = open[0];
    const overdue = f.dueDate && isOverdue(f.dueDate);
    return {
      tone: overdue ? 'danger' : (isToday(f.dueDate) ? 'warn' : 'accent'),
      icon: '🔔',
      text: f.title,
      hint: f.dueDate ? (overdue ? 'überfällig seit ' + formatDate(f.dueDate) : 'fällig ' + relativeDays(f.dueDate)) : 'ohne Datum',
      followupId: f.id
    };
  }
  const last = lastContactAt(clientId);
  if (!last) return { tone: 'warn', icon: '👋', text: 'Noch kein Kontakt erfasst', hint: 'Erste Interaktion anlegen' };
  const days = daysSince(last);
  if (days >= settings().staleDays) {
    return { tone: 'warn', icon: '🌵', text: 'Seit ' + days + ' Tagen kein Kontakt', hint: 'Zuletzt am ' + formatDate(last) };
  }
  return { tone: 'muted', icon: '✅', text: 'Alles ruhig', hint: 'Letzter Kontakt ' + relativeDays(dateKey(new Date(last))) };
}

function entryDayKey(entry) { return dateKey(new Date(entry.startedAt)); }
function minutesInRange(entries, fromKey, toKey) {
  return entries.reduce((sum, e) => {
    const key = entryDayKey(e);
    if (fromKey && key < fromKey) return sum;
    if (toKey && key > toKey) return sum;
    return sum + (e.durationMinutes || 0);
  }, 0);
}
function weekMinutes() {
  const start = weekStartKey(new Date());
  return memo('weekMinutes:' + start, () => minutesInRange(D().timeEntries, start, addDaysKey(start, 6)));
}
function projectWeekMinutes(projectId) {
  const start = weekStartKey(new Date());
  return minutesInRange(timeEntriesOfProject(projectId), start, addDaysKey(start, 6));
}
function projectTotalMinutes(projectId) {
  return timeEntriesOfProject(projectId).reduce((s, e) => s + (e.durationMinutes || 0), 0);
}
function openTaskCount(projectId) { return D().tasks.filter(t => t.projectId === projectId && t.status !== 'done').length; }

function needsBackupHint() {
  const meta = D().meta;
  if (state.ui.backupHintDismissed) return false;
  const hasData = ENTITY_ARRAYS.some(key => D()[key].length > 0);
  if (!hasData) return false;
  if (!meta.lastBackupAt) return true;
  return daysSince(meta.lastBackupAt) >= meta.settings.backupIntervalDays;
}
function isEmptyDb() { return ENTITY_ARRAYS.every(key => D()[key].length === 0); }

function statusBadge(map, key) {

function projectLink(projectId) {

function projectDot(project) {

function clientOptions(selectedId, includeEmpty) {

  const head = includeEmpty ? `<option value="">— kein Kunde —</option>` : '';
  return head + list.map(c => `<option value="${attr(c.id)}"${c.id === selectedId ? ' selected' : ''}>${esc(c.name)}${c.company ? ' (' + esc(c.company) + ')' : ''}</option>`).join('');

function projectOptions(clientId, selectedId, includeEmpty) {
  let list = D().projects.filter(p => p.status !== 'archived' || p.id === selectedId);
  if (clientId) list = list.filter(p => p.clientId === clientId);
  list = sortBy(list, p => p.name.toLowerCase());
  const head = includeEmpty ? `<option value="">— kein Projekt —</option>` : '';
  return head + list.map(p => {
    const c = getClient(p.clientId);
    return `<option value="${attr(p.id)}"${p.id === selectedId ? ' selected' : ''}>${esc(p.name)}${c ? ' — ' + esc(c.name) : ''}</option>`;
  }).join('');
}
function selectOptions(map, selected) {
  return Object.keys(map).map(key => {
    const label = typeof map[key] === 'string' ? map[key] : map[key].label;
    return `<option value="${attr(key)}"${key === selected ? ' selected' : ''}>${esc(label)}</option>`;
  }).join('');
}
function followupRow(f, opts) {
  const o = opts || {};
  const overdue = f.status === 'open' && f.dueDate && isOverdue(f.dueDate);
  const today = f.status === 'open' && f.dueDate && isToday(f.dueDate);
  const badge = f.status === 'done'
    ? `<span class="badge badge--success">Erledigt</span>`
    : (overdue ? `<span class="badge badge--danger">Überfällig</span>`
      : (today ? `<span class="badge badge--warn">Heute</span>` : `<span class="badge">${esc(relativeDays(f.dueDate))}</span>`));
  const where = [];
  if (f.clientId) where.push(clientLink(f.clientId));
  if (f.projectId) where.push(projectLink(f.projectId));
  return `<li class="list__item">
    <button class="btn btn--sm btn--icon" data-action="followup:toggle" data-id="${attr(f.id)}"
      aria-label="${f.status === 'open' ? 'Als erledigt markieren' : 'Wieder öffnen'}"
      title="${f.status === 'open' ? 'Als erledigt markieren' : 'Wieder öffnen'}">${f.status === 'open' ? '○' : '✔'}</button>
    <div class="list__main">
      <div class="list__title ${f.status === 'done' ? 'done-text' : ''}">${esc(f.title)}</div>
      <div class="list__meta">${badge} ${f.dueDate ? esc(formatDate(f.dueDate)) : 'ohne Datum'}${where.length ? ' · ' + where.join(' · ') : ''}</div>
      ${f.notes ? `<div class="list__meta pre-wrap">${esc(truncate(f.notes, 180))}</div>` : ''}
    </div>
    ${o.hideActions ? '' : `<div class="list__actions">
      <button class="btn btn--sm btn--ghost" data-action="followup:edit" data-id="${attr(f.id)}" aria-label="Wiedervorlage bearbeiten">✏️</button>
      <button class="btn btn--sm btn--ghost" data-action="followup:delete" data-id="${attr(f.id)}" aria-label="Wiedervorlage löschen">🗑</button>
    </div>`}
  </li>`;
}
function interactionRow(i, opts) {
  const o = opts || {};
  const type = INTERACTION_TYPE[i.type] || INTERACTION_TYPE.note;
  const dir = DIRECTION[i.direction] || DIRECTION.internal;
  const parts = [formatDateTime(i.occurredAt), type.label];
  if (i.contactId) { const c = getContact(i.contactId); if (c) parts.push(esc(c.name)); }
  return `<li class="list__item">
    <span class="timeline__icon" title="${attr(type.label)}" aria-hidden="true">${type.icon}</span>
    <div class="list__main">
      <div class="list__title">${esc(i.summary)}</div>
      <div class="list__meta"><span title="${attr(dir.label)}">${dir.icon}</span> ${parts.join(' · ')}
        ${!o.hideClient && i.clientId ? ' · ' + clientLink(i.clientId) : ''}
        ${!o.hideProject && i.projectId ? ' · ' + projectLink(i.projectId) : ''}</div>
      ${i.body ? `<details class="small"><summary class="muted">Details</summary><div class="pre-wrap">${esc(i.body)}</div></details>` : ''}
    </div>
    <div class="list__actions">
      <button class="btn btn--sm btn--ghost" data-action="interaction:edit" data-id="${attr(i.id)}" aria-label="Interaktion bearbeiten">✏️</button>
      <button class="btn btn--sm btn--ghost" data-action="interaction:delete" data-id="${attr(i.id)}" aria-label="Interaktion löschen">🗑</button>
    </div>
  </li>`;
}
function linkList(ownerType, ownerId) {

      </div>

}

        return `<li class="list__item">
          ${projectDot(p)}
          <div class="list__main">
            <div class="list__title"><a href="#/projects/${attr(p.id)}">${esc(p.name)}</a></div>
            <div class="list__meta">${clientLink(p.clientId)} · ${openTaskCount(p.id)} offene Aufgaben</div>
          </div>
          <div class="list__actions">
            <span class="badge${wm ? ' badge--accent' : ''}">${esc(formatDuration(wm))}</span>

    <div class="page-head"><h1>Heute</h1>
      <span class="badge${overdueCount ? ' badge--danger' : ''}">${overdueCount} überfällig</span>
      <button class="btn btn--primary" data-action="quickadd:open">+ Interaktion</button>
    </div>
    <div class="stat-row" style="margin-bottom:16px">

/* --- Kunden -------------------------------------------------------------- */
function filteredClients() {
  const q = state.ui.clientSearch.trim().toLowerCase();
  const status = state.ui.clientStatus;
  const stale = state.ui.clientStale;
  return D().clients.filter(c => {
    if (status !== 'all' && c.status !== status) return false;
    if (q) {
      const hay = [c.name, c.company, (c.tags || []).join(' '), c.email, c.notes].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (stale !== 'all') {
      const last = lastContactAt(c.id);
      if (stale === 'never') { if (last) return false; }
      else {
        const days = last === null ? Infinity : daysSince(last);
        if (days < Number(stale)) return false;
      }
    }
    return true;
  }).sort((a, b) => {
    const la = lastContactAt(a.id), lb = lastContactAt(b.id);
    if (la === lb) return a.name.localeCompare(b.name, LOCALE);
    if (!la) return -1;
    if (!lb) return 1;
    return la < lb ? 1 : -1;
  });
}

  const rows = list.length ? `<ul class="list">${list.map(c => {
    const open = openFollowups(c.id).length;
    const last = lastContactAt(c.id);
    const next = nextActionFor(c.id);
    return `<li class="list__item">

        <div class="list__meta">${statusBadge(CLIENT_STATUS, c.status)}
          ${open ? `<span class="badge badge--accent">${open} offen</span>` : ''}
          ${last ? 'Letzter Kontakt ' + esc(relativeDays(dateKey(new Date(last)))) : '<span class="badge badge--warn">Kein Kontakt</span>'}
          ${(c.tags || []).length ? ' · ' + (c.tags || []).map(t => esc(t)).join(', ') : ''}</div>

        <label class="field" style="flex:2 1 220px"><span class="field__label">Suche</span>
          <input class="input" type="search" data-bind="clientSearch" placeholder="Name, Firma, Tag…" value="${attr(state.ui.clientSearch)}"></label>
        <label class="field"><span class="field__label">Status</span>
          <select class="select" data-bind="clientStatus">
            <option value="all"${state.ui.clientStatus === 'all' ? ' selected' : ''}>Alle</option>

          <select class="select" data-bind="clientStale">

          </select></label>

  const contactsHtml = contacts.length ? `<ul class="list">${contacts.map(p => `<li class="list__item">

          ${p.email ? ` · <a href="mailto:${attr(p.email)}">${esc(p.email)}</a>` : ''}

  const projectsHtml = projects.length ? `<ul class="list">${projects.map(p => `<li class="list__item">

        <div class="list__meta">${statusBadge(PROJECT_STATUS, p.status)} ${openTaskCount(p.id)} offene Aufgaben · ${esc(formatDuration(projectTotalMinutes(p.id)))} gesamt</div>

  } else {

/* --- Projekte ------------------------------------------------------------ */
function filteredProjects() {
  const q = state.ui.projectSearch.trim().toLowerCase();
  const status = state.ui.projectStatus;
  return D().projects.filter(p => {
    if (status === 'open' && (p.status === 'archived' || p.status === 'done')) return false;
    if (status !== 'open' && status !== 'all' && p.status !== status) return false;
    if (q) {
      const client = getClient(p.clientId);
      const hay = [p.name, p.description, client ? client.name : '', client ? client.company : ''].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

/* --- Follow-ups ---------------------------------------------------------- */
function filteredFollowups() {
  const st = state.ui.followupStatus, when = state.ui.followupWhen, client = state.ui.followupClient;
  const t = todayKey();
  return D().followups.filter(f => {
    if (st !== 'all' && f.status !== st) return false;
    if (client !== 'all' && f.clientId !== client) return false;
    if (when !== 'all' && f.status === 'open') {
      if (!f.dueDate) return when === 'later';
      if (when === 'overdue' && !(f.dueDate < t)) return false;
      if (when === 'today' && f.dueDate !== t) return false;
      if (when === 'week' && !isThisWeek(f.dueDate)) return false;
      if (when === 'later' && !(f.dueDate > addDaysKey(weekStartKey(new Date()), 6))) return false;
    }
    return true;
  }).sort((a, b) => {
    if (a.status !== b.status) return a.status === 'open' ? -1 : 1;
    const da = a.dueDate || '9999-12-31', db = b.dueDate || '9999-12-31';
    return da < db ? -1 : (da > db ? 1 : 0);
  });
}

/* --- Zeit ---------------------------------------------------------------- */
function timeRangeKeys() {
  const r = state.ui.timeRange;
  const thisWeek = weekStartKey(new Date());
  if (r === 'week') return { from: thisWeek, to: addDaysKey(thisWeek, 6), label: 'Diese Woche' };
  if (r === 'lastweek') { const s = addDaysKey(thisWeek, -7); return { from: s, to: addDaysKey(s, 6), label: 'Letzte Woche' }; }
  if (r === 'month') {
    const d = new Date();
    const from = dateKey(new Date(d.getFullYear(), d.getMonth(), 1));
    const to = dateKey(new Date(d.getFullYear(), d.getMonth() + 1, 0));
    return { from, to, label: 'Dieser Monat' };
  }
  if (r === 'custom') return { from: state.ui.timeFrom || '0000-01-01', to: state.ui.timeTo || '9999-12-31', label: 'Zeitraum' };
  return { from: null, to: null, label: 'Alle' };
}
function entriesInRange() {
  const range = timeRangeKeys();
  return sortBy(D().timeEntries.filter(e => {
    const key = entryDayKey(e);
    if (range.from && key < range.from) return false;
    if (range.to && key > range.to) return false;
    return true;
  }), e => e.startedAt, true);
}

/* ============================================================================
   ROUTER
   ========================================================================= */
const ROUTES = [
  { re: /^\/?$/,                    build: () => ({ name: 'today', id: null }) },
  { re: /^\/today$/,                build: () => ({ name: 'today', id: null }) },
  { re: /^\/clients$/,              build: () => ({ name: 'clients', id: null }) },
  { re: /^\/clients\/([^/]+)$/,     build: m => ({ name: 'clientDetail', id: decodeURIComponent(m[1]) }) },
  { re: /^\/projects$/,             build: () => ({ name: 'projects', id: null }) },
  { re: /^\/projects\/([^/]+)$/,    build: m => ({ name: 'projectDetail', id: decodeURIComponent(m[1]) }) },
  { re: /^\/followups$/,            build: () => ({ name: 'followups', id: null }) },
  { re: /^\/time$/,                 build: () => ({ name: 'time', id: null }) },
  { re: /^\/settings$/,             build: () => ({ name: 'settings', id: null }) }
];

function parseHash() {
  const raw = location.hash.replace(/^#/, '');
  const [path, queryString] = raw.split('?');
  const query = {};
  if (queryString) {
    queryString.split('&').forEach(pair => {
      if (!pair) return;
      const [k, v] = pair.split('=');
      query[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });
  }
  for (const route of ROUTES) {
    const m = path.match(route.re);
    if (m) return Object.assign(route.build(m), { query });
  }
  return { name: 'notFound', id: null, query };
}

function applyRoute() {
  const next = parseHash();
  const changed = next.name !== state.route.name || next.id !== state.route.id;
  state.route = next;
  if (changed) {
    /* Ansichts-Filter, die nur zum Detail gehoeren, beim Wechsel zuruecksetzen */
    state.ui.timelineLimit = TIMELINE_PAGE;
    state.ui.timelineType = 'all';
    window.scrollTo(0, 0);
  }
  if (next.query.filter && next.name === 'followups') state.ui.followupWhen = next.query.filter;
  render();
}

let modalOpener = null;

function openModal(config) {
  modalOpener = document.activeElement;
  state.ui.modal = Object.assign({ id: uid() }, config);
  render();

function closeModal() {

  modalOpener = null;

}

/* Baut das Modal nur neu, wenn sich die Modal-Identitaet aendert — sonst
   wuerden Eingaben bei jedem Re-Render verloren gehen. */
function renderModal() {
  const root = document.getElementById('modal-root');
  const modal = state.ui.modal;
  if (!modal) { if (lastModalRef !== null) { root.innerHTML = ''; lastModalRef = null; } return; }
  if (lastModalRef === modal.id) return;
  lastModalRef = modal.id;
  const foot = modal.foot !== undefined ? modal.foot : `
    <button class="btn" type="button" data-action="modal:close">Abbrechen</button>
    <button class="btn btn--primary" type="submit" form="${attr(modal.formId || 'modal-form')}">${esc(modal.submitLabel || 'Speichern')}</button>`;
  root.innerHTML = `<div class="overlay" data-overlay>
    <div class="modal${modal.wide ? ' modal--wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__head"><h2 class="modal__title" id="modal-title">${esc(modal.title)}</h2>
        <button class="btn btn--ghost btn--icon btn--sm" type="button" data-action="modal:close" aria-label="Schließen">✕</button></div>
      <div class="modal__body">${modal.body}</div>
      <div class="modal__foot">${foot}</div>
    </div></div>`;
  const el = root.querySelector(modal.focus || 'input:not([type=hidden]), select, textarea, button');
  if (el) setTimeout(() => { try { el.focus(); if (el.select) el.select(); } catch (e) { /* egal */ } }, 0);
}

function trapFocus(ev) {
  const modal = document.querySelector('.modal');
  if (!modal) return;
  const focusables = modal.querySelectorAll('a[href], button:not([disabled]), input:not([type=hidden]), select, textarea, [tabindex]:not([tabindex="-1"])');
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
}

function field(label, inputHtml, hint) {
  return `<label class="field"><span class="field__label">${esc(label)}</span>${inputHtml}
    ${hint ? `<span class="field__hint">${esc(hint)}</span>` : ''}</label>`;
}
function toLocalInput(iso) {
  const d = iso ? new Date(iso) : new Date();
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function fromLocalInput(value) {
  if (!value) return nowIso();
  const d = new Date(value);
  return isNaN(d.getTime()) ? nowIso() : d.toISOString();
}
function formValues(form) {
  const out = {};
  new FormData(form).forEach((value, key) => { out[key] = typeof value === 'string' ? value.trim() : value; });
  form.querySelectorAll('input[type=checkbox]').forEach(cb => { out[cb.name] = cb.checked; });
  return out;
}
function markInvalid(form, name, message) {
  const el = form.querySelector('[name="' + name + '"]');
  if (!el) return;
  el.setAttribute('aria-invalid', 'true');
  const holder = el.closest('.field') || el.parentElement;
  let err = holder.querySelector('.field__error');
  if (!err) { err = document.createElement('span'); err.className = 'field__error'; holder.appendChild(err); }
  err.textContent = message;
  el.focus();
}
function clearErrors(form) {
  form.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
  form.querySelectorAll('.field__error').forEach(el => el.remove());
}

function parseTags(text) {
  return String(text || '').split(',').map(t => t.trim()).filter(Boolean);
}
function detectLinkKind(url) {
  const u = String(url || '').toLowerCase();
  if (/^file:/.test(u)) return 'folder';
  if (/^mailto:/.test(u)) return 'mail';
  if (/^tel:/.test(u)) return 'web';
  if (/icloud\.com\/notes|^notes:|^mobilenotes:|bear:|things:|obsidian:/.test(u)) return 'note';
  if (/github\.com|gitlab\.com|bitbucket\.org|^git@/.test(u)) return 'repo';
  if (/atlassian\.net\/(browse|jira)|jira\.|linear\.app|youtrack|asana\.com|trello\.com/.test(u)) return 'ticket';
  if (/confluence|notion\.so|docs\.google\.com|coda\.io|\/wiki\//.test(u)) return 'docs';
  if (/figma\.com|sketch\.com|penpot|miro\.com|excalidraw/.test(u)) return 'design';
  return 'web';
}
function isSafeUrl(url) {
  const u = String(url || '').trim();
  if (!u) return false;
  if (/^\s*javascript:/i.test(u) || /^\s*data:/i.test(u) || /^\s*vbscript:/i.test(u)) return false;
  return /^[a-z][a-z0-9+.-]*:/i.test(u) || /^\//.test(u);
}
function snapshot() { return JSON.parse(JSON.stringify(state.data)); }
function restoreSnapshot(snap) {
  state.data = migrate(snap);
  bumpData(); persist(); render();
}

        Object.assign(c, { name: v.name, company: v.company, email: v.email, phone: v.phone, status: v.status, notes: v.notes, tags: parseTags(v.tags) });

          status: v.status || 'active', notes: v.notes, tags: parseTags(v.tags), createdAt: nowIso()

        v.id = client.id;
